<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects | Vincent 歐家銘</title>
  <meta name="description" content="Architectural Works & Projects by Vincent 歐家銘">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400"
    rel="stylesheet">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- Global Header -->
  <header class="site-header">
    <a href="index.html" class="brand">
      <span class="brand-monogram">VO</span>
      <div class="brand-names">
        <span class="brand-en">Vincent</span>
        <span class="brand-cn">歐家銘</span>
      </div>
    </a>

    <nav class="main-nav" aria-label="Main Navigation">
      <ul>
        <li><a href="projects.html" class="active">Projects</a></li>
        <li><a href="about.html">About</a></li>
      </ul>
    </nav>
  </header>

  <!-- Page Main Content -->
  <main class="page-container">
    <div class="projects-page-wrapper">
      
      <!-- Project List Grid Container (Populated dynamically from projects.json) -->
      <section class="projects-grid" id="projects-grid" aria-label="Selected Projects">
        <!-- Rendered by js/main.js -->
      </section>

    </div>

    <!-- Global Footer -->
    <footer class="site-footer">
      <p class="footer-copy">© 2026 Vincent Ou 歐家銘. All rights reserved.</p>
      <div class="footer-social" id="footer-social-links">
        <a href="https://linkedin.com" target="_blank" rel="noopener noreferrer">LinkedIn</a>
        <a href="https://github.com" target="_blank" rel="noopener noreferrer">GitHub</a>
      </div>
      <p class="footer-note">National Taiwan University of Science and Technology (NTUST)</p>
    </footer>
  </main>

  <!-- Project Detail Modal (Tasks 3 & 4: Popup with cycling gallery) -->
  <div class="project-modal" id="project-modal" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal-backdrop" id="modal-backdrop"></div>
    
    <div class="modal-window">
      <!-- Close Button -->
      <button class="modal-close-btn" id="modal-close-btn" aria-label="Close project modal">
        <span class="close-icon">✕</span>
        <span class="close-text">ESC</span>
      </button>

      <!-- Modal Content: Split Grid Layout -->
      <div class="modal-body">
        
        <!-- Left Column: Editorial & Project Information -->
        <div class="modal-info-col">
          <div class="modal-meta-top">
            <span class="modal-category" id="modal-category">REVITALIZATION</span>
            <span class="modal-year" id="modal-year">2022</span>
          </div>

          <h2 class="modal-title" id="modal-title">Project Title</h2>
          <p class="modal-location" id="modal-location">Jakarta, Indonesia</p>

          <div class="modal-specs" id="modal-specs">
            <!-- Typology, Scale, Status injected dynamically -->
          </div>

          <div class="modal-divider"></div>

          <div class="modal-narrative">
            <p class="modal-brief" id="modal-brief"></p>
            <p class="modal-description" id="modal-description"></p>
          </div>
        </div>

        <!-- Right Column: Interactive Gallery Showcase with Looping Arrows -->
        <div class="modal-gallery-col">
          <div class="gallery-viewport" id="gallery-viewport">
            <img id="gallery-current-image" src="" alt="Project Photo" class="gallery-image">

            <!-- Minimalist Navigation Arrows (Looping) -->
            <button class="gallery-nav-btn prev" id="gallery-prev-btn" aria-label="Previous image">
              <span class="arrow-sym">←</span>
            </button>
            <button class="gallery-nav-btn next" id="gallery-next-btn" aria-label="Next image">
              <span class="arrow-sym">→</span>
            </button>
          </div>

          <!-- Gallery Bottom Bar: Caption and Loop Counter -->
          <div class="gallery-meta-bar">
            <p class="gallery-caption" id="gallery-caption">Caption</p>
            <span class="gallery-counter" id="gallery-counter">01 / 03</span>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- Main JavaScript for JSON Data Integration -->
  <script src="js/main.js"></script>
</body>

</html>
